[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "active-drone-mb"
version = "0.5.0"
description = "Constitutive Markov-blanket inversion in individual and collective drones"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
  {name = "Luca M. Possati"}
]
keywords = ["active inference", "Markov blanket", "expected free energy", "multi-agent systems"]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "matplotlib>=3.7"
]

[project.urls]
Repository = "https://github.com/"

[tool.setuptools]
packages = ["active_drone"]

